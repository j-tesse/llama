# Model under test — sourced by every script. Switching models = edit this file only.
# Findings per model: models/<NAME>.md

NAME="deepseek-v4-flash"                    # download dir ~/models/gguf/<NAME>, notes models/<NAME>.md
REPOSITORY="unsloth/DeepSeek-V4-Flash-0731-GGUF"
INCLUDE="UD-IQ3_XXS/*"                      # `hf download --include`. Fallback: UD-IQ2_M/* (90.9gb)
MODEL_FILE="UD-IQ3_XXS/DeepSeek-V4-Flash-0731-UD-IQ3_XXS-00001-of-00004.gguf"   # first shard, relative to the download dir
SIZE_GB=104
ALIAS="DeepSeek-V4-Flash-0731"              # id on /v1/models → lands in agent configs
CONTEXT_SIZE=32768

# Appended to start.sh's generic llama-server flags. tune.sh variants are appended after these (last flag wins).
SERVER_ARGS=(
  --n-cpu-moe 34                            # expert layers in RAM
  --batch-size 6144 --ubatch-size 6144      # prefill is PCIe-bound per ubatch
  --temp 1.0 --top-p 0.95 --min-p 0.0
)
